name: Deploy English practice to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Verify application
        run: |
          npm run lint
          npm run typecheck
          npm test
      - name: Build public English game
        run: npm run build:pages
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Install browser for static export checks
        run: npx playwright install --with-deps chromium
      - name: Verify exported site
        run: npm run test:pages
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: sites/english-game/out

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
